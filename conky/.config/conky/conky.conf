conky.config = {
    alignment = 'top_right',
    background = false,
    border_width = 0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    default_color = 'ffffff',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = true,
    default_shade_color = '000000',
    use_xft = true,
    font = 'Ubuntu:size=11',
    gap_x = 28,
    gap_y = 56,
    minimum_height = 5,
    minimum_width = 230,
    no_buffers = true,
    out_to_console = false,
    out_to_stderr = false,
    extra_newline = false,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 175,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_colour = '1e1e1e',
    stippled_borders = 0,
    update_interval = 2.0,
    uppercase = false,
    use_spacer = 'none',
    show_graph_scale = false,
    show_graph_range = false,
    top_cpu_separate = true,
};

conky.text = [[
${font Ubuntu:bold:size=14}${color ffffff}${nodename}${font}
${color 999999}${font Ubuntu:size=9}${kernel} · ${sysname}${font}
${color 999999}${hr 1}

${font Ubuntu:bold:size=10}${color ffffff}CPU${font} ${alignr}${color 999999}${freq_g} GHz · ${acpitemp}°C
${color ffffff}${cpu cpu0}% ${alignr}load ${loadavg 1}
${color 6fc32e}${cpugraph 20,230 6fc32e ff5c33}

${font Ubuntu:bold:size=10}${color ffffff}Memory${font}${alignr}${color 999999}${mem} / ${memmax}
${color 3168d5}${membar 6,230}
${color ffffff}Swap ${swap} / ${swapmax} ${alignr}${swapperc}%

${font Ubuntu:bold:size=10}${color ffffff}Disk${font}${alignr}${color 999999}${fs_used /} / ${fs_size /}
${color 3168d5}${fs_bar 6,230 /}
${color ffffff}Read ${alignr}${diskio_read}
${color ffffff}Write${alignr}${diskio_write}

${font Ubuntu:bold:size=10}${color ffffff}Network${font} ${alignr}${color 999999}${addr wlp0s20f3}
${color ffffff}Down ${downspeed wlp0s20f3} ${alignr}Up ${upspeed wlp0s20f3}
${color 6fc32e}${downspeedgraph wlp0s20f3 20,110 6fc32e 3168d5} ${alignr}${color ff9500}${upspeedgraph wlp0s20f3 20,110 ff9500 3168d5}

${font Ubuntu:bold:size=10}${color ffffff}Battery${font}${alignr}${color 999999}${battery_status BAT0}
${color ffffff}${battery_bar 6,230 BAT0}

${font Ubuntu:bold:size=10}${color ffffff}Top Processes${font}
${color 999999}${top name 1}${alignr}${top cpu 1}%
${color 999999}${top name 2}${alignr}${top cpu 2}%
${color 999999}${top name 3}${alignr}${top cpu 3}%

${color 999999}${hr 1}
${color ffffff}Uptime${alignr}${uptime}


]];
