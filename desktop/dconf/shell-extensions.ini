[dash-to-dock]
autohide=true
click-action='minimize'
dash-max-icon-size=32
dock-fixed=false
dock-position='BOTTOM'
extend-height=false
intellihide=false
multi-monitor=true
preferred-monitor=-2
preferred-monitor-by-connector='eDP-1'

[dash-to-panel]
extension-version=73
panel-anchors='{}'
panel-element-positions='{}'
panel-lengths='{}'
panel-positions='{}'
panel-sizes='{}'
prefs-opened=false
show-apps-icon-file='@HOME@/.icons/WinXPSVG-plasma5up-scalable-icontheme-blackysgate.de/scalable/places/start-here.svg'

[ding]
check-x11wayland=true
icon-size='standard'
show-home=true
start-corner='bottom-right'

[tiling-assistant]
active-window-hint-color='rgb(211,70,21)'
disable-tile-groups=false
enable-tiling-popup=true
last-version-installed=46
overridden-settings={'org.gnome.mutter.edge-tiling': <@mb nothing>, 'org.gnome.mutter.keybindings.toggle-tiled-left': <@mb nothing>, 'org.gnome.mutter.keybindings.toggle-tiled-right': <@mb nothing>}
tiling-popup-all-workspace=true

[user-theme]
name='WhiteSur-Light'

[vitals]
hot-sensors=['_processor_usage_', '_memory_usage_', '__network-rx_max__']
position-in-panel=2
show-battery=true
show-fan=false
show-gpu=false
show-memory=true
show-network=true
show-processor=true
show-storage=true
show-system=false
show-temperature=true
show-voltage=false
update-time=3
